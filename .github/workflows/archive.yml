name: Archive

# Day-one archiver: every 15 min across ~5am-8pm Pacific (UTC hours below
# cover both PDT and PST). The script decides per source what's due, so late
# or skipped cron runs are harmless.
on:
  schedule:
    - cron: "8,23,38,53 12-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated source ids to capture (blank = everything due)"
        required: false
        default: ""
      force:
        description: "Ignore cadence and daylight gating"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # the archive gateway authenticates this run by its OIDC token
  actions: write # restart the pacemaker if its chain broke

concurrency:
  group: archive
  cancel-in-progress: false

env:
  # Private Supabase bucket via the archive-gateway edge function (no secrets).
  # Set the SNORKEL_STORAGE repo variable to override, e.g. `s3:<bucket>`.
  SNORKEL_STORAGE: ${{ vars.SNORKEL_STORAGE || 'gateway:https://dujjlhiytnrtsebxshhw.supabase.co/functions/v1/archive-gateway' }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      SNORKEL_CONTACT: ${{ vars.SNORKEL_CONTACT }}
      ONLY: ${{ inputs.only }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Archive
        run: |
          args=()
          for source in $ONLY; do args+=(--only "$source"); done
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          uv run snorkel archive "${args[@]}"

      - name: Keep the pacemaker running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pacemaker.yml/runs?per_page=5" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null) || active=1
          if [ "$active" = "0" ]; then
            gh workflow run pacemaker.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "Pacemaker restarted."
          fi
