name: Archive

# Day-one archiver: every 15 min across ~5am-8pm Pacific (UTC hours below
# cover both PDT and PST). The script decides per source what's due and
# gates the cam on sun elevation, so late or skipped cron runs are harmless.
on:
  schedule:
    - cron: "7,22,37,52 12-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated source ids to capture (blank = everything due)"
        required: false
        default: ""
      force:
        description: "Ignore cadence and daylight gating"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SNORKEL_STORAGE: s3
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      SNORKEL_CONTACT: ${{ vars.SNORKEL_CONTACT }}
      CAM_CAPTURE_ENABLED: ${{ vars.CAM_CAPTURE_ENABLED }}
      ONLY: ${{ inputs.only }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Check storage secrets
        run: |
          for name in S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. See docs/setup.md."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ffmpeg (cam HLS frames)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - run: uv sync --locked --extra browser

      # Headless Chromium is the cam's last-resort strategy. Once a direct
      # snapshot or HLS URL is confirmed, these two steps can go.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run playwright install --with-deps --only-shell chromium

      - name: Archive
        run: |
          args=()
          for source in $ONLY; do args+=(--only "$source"); done
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          uv run snorkel archive "${args[@]}"
