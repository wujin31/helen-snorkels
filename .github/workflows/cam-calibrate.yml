name: Cam calibrate

# Finds the Scripps Pier pilings in recent archived frames and saves their
# positions to the private archive (state/cam_rois.json). Frames never leave
# the archive and the log shows geometry only. The scorer also recalibrates on
# its own (weekly, or daily while pilings are missing); run this to force it.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the archive gateway authenticates this run by its OIDC token

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNORKEL_STORAGE: ${{ vars.SNORKEL_STORAGE || 'gateway:https://dujjlhiytnrtsebxshhw.supabase.co/functions/v1/archive-gateway' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run snorkel cam-calibrate
