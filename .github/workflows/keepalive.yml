name: Keepalive

# GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity. Re-enabling them monthly keeps the archiver running
# through quiet stretches. Schedules run as whoever last edited the cron
# lines, so edit them as the repo owner (a commit authored by an account
# without access to this repo leaves them silently never firing).
on:
  schedule:
    - cron: "16 9 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in archive.yml score.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable"
          done
