name: Pacemaker

# Fills the gaps GitHub's scheduler leaves. Cron schedules on this repository
# fire late, in bursts, or not at all for hours, so this job checks every
# 5 minutes when Archive and Score last ran (from any trigger) and dispatches
# whichever is overdue during its daylight window. When the scheduler is
# healthy it finds nothing overdue and does nothing; the archiver's cadence
# check makes an occasional overlap harmless.
#
# It runs around the clock as a chain: each run queues its successor as soon
# as it starts, and the concurrency group holds that run until this one ends,
# however it ends. (On 2026-10-05 a hosted runner was lost mid-run, and with
# the successor only dispatched at the end, the chain stopped for 3.5 h.)
# Archive and Score also restart it if no run is active or queued, and it can
# be started by hand: Actions -> Pacemaker -> Run workflow.
on:
  workflow_dispatch:

permissions:
  actions: write # read run history; dispatch archive/score/pacemaker (allowed with GITHUB_TOKEN)

concurrency:
  group: pacemaker
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch archive and score when they're overdue
        run: |
          set -uo pipefail
          end=$(( $(date +%s) + 330 * 60 ))
          ensure_successor() { # queue the next run unless one is already waiting
            local waiting
            waiting=$(gh api "repos/$REPO/actions/workflows/pacemaker.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and .id != $GITHUB_RUN_ID)] | length" \
              2>/dev/null) || waiting=0
            if [ "$waiting" = "0" ]; then
              gh workflow run pacemaker.yml --repo "$REPO" --ref main && echo "Queued the next pacemaker run."
            fi
          }
          ensure_successor
          in_window() { # UTC hours 12-23 and 0-$1, the cron schedules' span (~5am-8pm Pacific)
            local h=$((10#$(date -u +%H)))
            [ "$h" -ge 12 ] || [ "$h" -le "$1" ]
          }
          minutes_since_last() { # latest run of workflow file $1, any event; huge if unknown
            local created
            created=$(gh api "repos/$REPO/actions/workflows/$1/runs?per_page=1" \
              --jq '.workflow_runs[0].created_at // empty' 2>/dev/null) || created=""
            if [ -z "$created" ]; then echo 99999; return; fi
            echo $(( ($(date +%s) - $(date -d "$created" +%s)) / 60 ))
          }
          while [ "$(date +%s)" -lt "$end" ]; do
            if in_window 3; then
              age=$(minutes_since_last archive.yml)
              if [ "$age" -ge 14 ]; then
                gh workflow run archive.yml --repo "$REPO" --ref main \
                  && echo "$(date -u +%H:%M) archive dispatched (last run ${age} min ago)"
              fi
            fi
            if in_window 2; then
              age=$(minutes_since_last score.yml)
              if [ "$age" -ge 58 ]; then
                gh workflow run score.yml --repo "$REPO" --ref main \
                  && echo "$(date -u +%H:%M) score dispatched (last run ${age} min ago)"
              fi
            fi
            sleep 300
          done
          ensure_successor # in case the dispatch at the start failed
