# Pier-cam visibility model (src/snorkel/cv/pier_cam.py). Every value is a
# prior to validate. Frames never leave the private archive: calibration and
# readings run in GitHub Actions and only numbers come out.

# The Shore Stations' piling guide (PierViz): pilings stand this far from the
# camera. Seeing the one at 14 ft but not 30 ft means 14-30 ft visibility.
piling_distances_ft: [4, 11, 14, 30]
max_vis_ft: 40              # top of the "30+" bin, for display

rows: [0.35, 0.95]          # vertical span of the frame the pilings are measured over
min_band_depth: 0.08        # a piling is a column band at least this much darker than the water trend
min_band_width: 0.008       # ... and at least this wide (fraction of frame width)
visible_contrast: 0.05      # |Weber contrast| against the water beside it at which a piling counts as seen
min_brightness: 25          # darker frames (grey 0-255) get no reading
moved_shift: 0.03           # how far (fraction of width) the pilings may shift before the camera counts as moved

calibration:
  days: 7                   # look back this far for clear daylight frames
  candidates: 60            # frames fetched to choose from
  frames: 20                # clearest frames whose median profile finds the pilings
  min_sun_elevation_deg: 15
  max_age_days: 7           # recalibrate after this

# Scripps hasn't OK'd showing cam-derived numbers yet (docs/scripps-cam-request.md).
# While false, readings go only to the private archive (state/cam_readings/),
# never to status.json, the public history, the score or job logs.
publish: false
