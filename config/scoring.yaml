# v0 scoring rules. Every number here is a PRIOR TO VALIDATE against her logs
# and the archive; nothing is calibrated yet. Spot-specific thresholds live in
# spots.yaml.

preferences:                 # hers; ask and adjust
  min_vis_ft: 10             # "Yes" needs at least this much estimated vis
  max_difficulty: moderate   # easy | moderate | advanced
  earliest_local: "06:30"    # best-window search starts here (or sunrise)
  latest_end_before_sunset_min: 60

staleness_hours:             # older than this and a source counts as stale
  waves: 4
  wind: 3
  tides: 72                  # predictions are good for days
  water_temp: 12
  chlorophyll: 24
  turbidity: 6
  water_quality: 30          # the county posts roughly daily; sampling is weekly
  rain: 6
  alerts: 3
  surf_forecast: 18         # NWS issues the SRF two or three times a day

gates:
  rain_mm_24h: 2.5           # ~0.1 in in a day starts the county's 72 h advisory
  rain_advisory_hours: 72
  hazard_alerts:             # NWS events that make it a No
    - High Surf Warning
    - High Surf Advisory
    - Tsunami Warning
    - Tsunami Advisory
  caution_alerts:            # NWS events that cap the verdict at Maybe
    - Beach Hazards Statement
    - Rip Current Statement
  comfortable_fraction: 0.7  # Yes needs Hs and wind at or under 70% of the spot threshold

visibility:
  # Predicted turbidity from near-bottom wave motion and plankton, read off the
  # turbidity curve below: ln NTU = intercept + a * orbital + b * ln(chl).
  # Fitted 2026-10-06 to the Scripps Pier ECO sensor, Jul 4 - Oct 5 (915 hourly
  # daylight samples, MOP D0496 at 4 m). Out of sample (fit on one half of the
  # summer, test on the other): Spearman 0.56-0.70 against the sensor, typical
  # error ~5 ft, and the +/-35% band holds the sensor's value 72-76% of the
  # time. The old hand-set proxy (20 ft - 22 ft per m/s) read ~10 ft low with
  # the band holding it 19% of the time. probe/calibrate has the backtest.
  ln_ntu_intercept: -1.80
  ln_ntu_per_orbital_ms: 3.5
  ln_ntu_per_ln_chl: 0.49    # power law, so it extrapolates sanely into blooms
  typical_chl_ug_l: 0.65     # summer median at the pier; used when the sensor is stale
  min_orbital_ms: 0.15       # calmer than the fitted data: not predicted any clearer than this
  min_chl_ug_l: 0.3          # likewise for less plankton than the fit's clearest days
  half_life_h: 24            # swell stirs the bottom for a day or two (12-48 h fit equally well)
  chl_threshold_ug_l: 2.0    # above this the Plankton factor reads as a minus
  rain_recent_days: 5        # rain after the gate lifts still clouds nearshore water
  rain_recent_penalty_ft: 3
  wind_threshold_kt: 8       # surface chop. Turbidity doesn't track wind (Spearman 0.04),
  wind_ft_per_kt: 0.5        # so this is an untested prior about the view from the surface
  min_ft: 2
  max_ft: 40
  spread_fraction: 0.35      # +/- band: holds ~3/4 of sensor readings (backtest above)

pier: [32.8666, -117.2571]   # Scripps Pier, where the turbidity and chlorophyll sensors are

turbidity:                   # Scripps Pier ECO turbidity sensor (~1 km from the Marine Room)
  vis_ft_at_1_ntu: 9         # vis_ft = vis_ft_at_1_ntu / ntu^exponent (prior; sets the scale of every estimate)
  exponent: 0.9
  weight_near_pier: 0.6      # blend weight vs the wave proxy at spots with `near_pier` set
  weight_elsewhere: 0.3
  max_distance_km: 6          # farther from Scripps Pier than this, its sensor says nothing about the spot
  min_valid_ntu: 0.15         # lower than nearshore water ever gets here: a sensor fault, so ignored

window:                      # hourly sub-scores for the best-window search
  incoming_bonus: 1.0
  slack_high_bonus: 0.5
  outgoing_penalty: 0.5
  below_min_tide_penalty: 3.0
  wind_weight: 2.0           # score -= weight * (wind / spot max wind)^2
  slot_minutes: 30
  min_minutes: 90
  max_minutes: 180

wetsuit_f:                   # water temp (°F) lower bound -> suggestion
  - [72, "Rash guard or shorty"]
  - [68, "3/2 mm shorty or springsuit"]
  - [64, "3/2 mm full suit"]
  - [60, "4/3 mm full suit"]
  - [56, "5/4 mm full suit + hood"]
  - [-100, "5/4 mm + hood, boots and gloves"]
