[project]
name = "snorkel"
version = "0.1.0"
description = "Snorkel Status: San Diego go/no-go from public ocean data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astral>=3.2",
    "boto3>=1.35",
    "httpx>=0.27",
    "netCDF4>=1.7",
    "numpy>=1.26",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "xarray>=2024.7",
]

[project.optional-dependencies]
# Headless-browser fallback for grabbing a pier-cam still when no direct
# snapshot or HLS URL can be found. Only the archive workflow installs it.
browser = ["playwright>=1.47"]

[project.scripts]
snorkel = "snorkel.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snorkel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # netCDF4/cftime wheels vs numpy 2 ABI notice; harmless
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
